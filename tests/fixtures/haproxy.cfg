global
    uid 65534
    gid 65534

defaults
    mode http

frontend mtproxyl_http
    bind :80
    default_backend mtproxyl_static

frontend mtproxyl_public
    mode tcp
    bind :443
    use_backend mtproxyl_web_tls if { req.ssl_sni -i cdn.example.com }
    acl remnawave_sni req.ssl_sni -i gateway.example.com
    use_backend remnawave_xray if remnawave_sni
    default_backend mtproxyl_mtproto

backend mtproxyl_web_tls
    mode tcp
    server web_tls 127.0.0.1:15444 send-proxy

backend mtproxyl_mtproto
    mode tcp
    server mtproto 127.0.0.1:15443 send-proxy

frontend mtproxyl_selfmask
    bind 127.0.0.1:8444 ssl crt "@mtproxyl/site"
    default_backend mtproxyl_site

backend mtproxyl_site
    server site 127.0.0.1:15481

backend mtproxyl_static
    server static 127.0.0.1:15481

frontend mtproxyl_web
    bind 127.0.0.1:15444 accept-proxy ssl crt "@mtproxyl/site"
    default_backend mtproxyl_web

backend mtproxyl_web
    server web 127.0.0.1:15080

backend remnawave_xray
    mode tcp
    server remnawave 127.0.0.1:1443
